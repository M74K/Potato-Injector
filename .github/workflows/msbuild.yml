name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

    - name: Build
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=x64 /p:PlatformToolset=v143 ${{ env.SOLUTION_FILE_PATH }}

    - name: Show build outputs
      shell: powershell
      run: |
        Write-Host "EXE files:"
        Get-ChildItem -Path . -Recurse -Filter *.exe |
          Select-Object FullName, Length

        Write-Host "DLL files:"
        Get-ChildItem -Path . -Recurse -Filter *.dll |
          Select-Object FullName, Length

    - name: Collect build files
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path artifact

        Get-ChildItem -Path . -Recurse -Filter *.exe |
          Where-Object { $_.FullName -notmatch '\\artifact\\' } |
          Copy-Item -Destination artifact

        Get-ChildItem -Path . -Recurse -Filter *.dll |
          Where-Object { $_.FullName -notmatch '\\artifact\\' } |
          Copy-Item -Destination artifact

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: Potato-Injector-Release-x64
        path: artifact/*
        if-no-files-found: error
