name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Show MSBuild version
      run: msbuild -version

    - name: Restore NuGet packages
      run: nuget restore potatoInjector.sln

    - name: Build x64 Release
      run: |
        msbuild potatoInjector.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64

    - name: Show build files
      shell: powershell
      run: |
        Get-ChildItem -Path . -Recurse -Include *.exe,*.dll |
          Select-Object FullName, Length

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: Potato-Injector-x64-Release
        path: x64/Release/potatoInjector.exe
        if-no-files-found: error
